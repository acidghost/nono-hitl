# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - just web

builds:
  - binary: nono-hitl
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
    flags:
      - -trimpath
      - -mod=readonly
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X main.buildVersion=v{{ .Version }}
      - -X main.buildCommit={{ .FullCommit }}
      - -X main.buildDate={{ .CommitDate }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - UNLICENSE

checksum:
  name_template: SHA256SUMS

release:
  prerelease: auto

changelog:
  sort: asc
