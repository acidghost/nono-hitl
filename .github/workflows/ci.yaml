name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Run checks
        run: just check

      - name: Smoke test
        run: just run --help

      - name: Check GoReleaser configuration
        run: just release-check

      - name: Build and smoke-test release archives
        shell: bash
        run: |
          just release-snapshot
          (cd dist && sha256sum -c SHA256SUMS)
          for target in darwin_arm64 linux_amd64 linux_arm64; do
            archives=(dist/nono-hitl_*_"$target".tar.gz)
            test "${#archives[@]}" -eq 1 && test -f "${archives[0]}" || exit 1
          done
          tar -xzf dist/nono-hitl_*_linux_amd64.tar.gz -C dist nono-hitl
          dist/nono-hitl --help
          dist/nono-hitl version | grep -Fx "Commit:  $(git rev-parse HEAD)"

      - name: Build and smoke-test image without pushing
        shell: bash
        run: |
          docker build --platform linux/amd64 --tag nono-hitl:ci .
          test "$(docker run --rm nono-hitl:ci version)" = "$(dist/nono-hitl version)"

      - name: End-to-end tests
        run: just e2e

      - name: Upload end-to-end results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: internal/webui/test-results
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
